name: 刷步数

on:
  workflow_dispatch:

# 防止两轮任务重叠运行造成 token 文件冲突，后一轮排队等前一轮跑完
concurrency:
  group: mimotion-persist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }} #此处PAT需要申请，教程详见：README
          fetch-depth: 0
      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y
          
      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          
      - name: 开始
        env:
            CONFIG: ${{ secrets.CONFIG }}
            AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install -r requirements.txt
          python3 main.py

      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          git commit -m "persist tokens trigger by ${{ github.event_name }}" || echo "nothing to commit"
          # encrypted_tokens.data 是二进制文件，两边同时改会冲突；
          # 本地是刚生成的最新 token，冲突时以本地为准自动解决
          git pull --rebase -X theirs origin master
          git push origin master
